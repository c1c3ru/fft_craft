name: Reverse engineering pipeline

on:
  pull_request:
    paths:
      - 'FFT_Android_Mod/docs/re-tools/**'
      # A04 diagnostic APK has its own purpose-built PR regression gate;
      # unrelated ARM suites remain enabled for shared reverse-engineering tools.
      - '!FFT_Android_Mod/docs/re-tools/android-path-probe/**'
      - 'FFT_Android_Mod/docs/RE_COMPLETION_PLAN.md'
      - 'FFT_Android_Mod/docs/re-results/RE_COMPLETION_TRACKER.json'
      - 'FFT_Android_Mod/docs/re-results/semantic-certificates.json'
      - '.github/workflows/re-pipeline.yml'
      - '.github/workflows/re-batches.yml'
      - '.github/workflows/re-semantic-queue.yml'
      - 'FFT_Android_Mod/docs/RE_FUNCTION_INVENTORY.csv'
      - 'FFT_Android_Mod/src/lib/armeabi/libgl2jni.so'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Functions to analyze'
        required: false
        default: '25'

# Limit obsolete CI runs to the latest revision of each pull request.
# Keep manually dispatched runs independent of cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python3 -m pip install capstone pyelftools unicorn
      - name: Compile tools and run full regression suite
        run: |
          python3 -m compileall -q FFT_Android_Mod/docs/re-tools
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_*.py' -v
      - name: Validate roadmap tracker against the real original ARM ELF
        run: |
          set -euo pipefail
          sha=$(sha256sum FFT_Android_Mod/src/lib/armeabi/libgl2jni.so | cut -d' ' -f1)
          python3 FFT_Android_Mod/docs/re-tools/re_completion_tracker.py \
            --tracker FFT_Android_Mod/docs/re-results/RE_COMPLETION_TRACKER.json \
            --expected-sha "$sha" | tee /tmp/re-plan-check.log
          grep -qx 'RE_COMPLETION_TRACKER_VALID=1' /tmp/re-plan-check.log
          # Roadmap task count grows as gaps are discovered.
          test "$(sed -n 's/^RE_COMPLETION_TRACKER_TASKS=//p' /tmp/re-plan-check.log)" -ge 1

  structural-smoke:
    # Bounded smoke tests run on PRs as well as manual dispatches.
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python3 -m pip install capstone pyelftools unicorn
      - name: Structural batch
        env:
          REQUESTED_LIMIT: ${{ inputs.limit }}
        run: |
          LIMIT="${REQUESTED_LIMIT:-3}"
          python3 FFT_Android_Mod/docs/re-tools/parallel_loop.py \
            --workers 3 --limit "$LIMIT" --timeout 120
      - name: Verify real ARM golden baseline
        if: success()
        run: |
          python3 FFT_Android_Mod/docs/re-tools/check_smoke.py \
            FFT_Android_Mod/docs/re-results
      - name: Batch 1 — 100 pending functions
        run: |
          python3 FFT_Android_Mod/docs/re-tools/parallel_loop.py \
            --workers 5 --limit 100 --timeout 120
          mkdir -p FFT_Android_Mod/docs/re-results/batch-summaries
          cp FFT_Android_Mod/docs/re-results/SUMMARY.md \
            FFT_Android_Mod/docs/re-results/batch-summaries/batch-100.md
      - name: Batch 2 — 150 more pending functions
        run: |
          python3 FFT_Android_Mod/docs/re-tools/parallel_loop.py \
            --workers 5 --limit 150 --timeout 120
          cp FFT_Android_Mod/docs/re-results/SUMMARY.md \
            FFT_Android_Mod/docs/re-results/batch-summaries/batch-250.md
      - name: Validate semantic evidence generation on real ARM ELF
        run: |
          python3 FFT_Android_Mod/docs/re-tools/progress_report.py
          python3 FFT_Android_Mod/docs/re-tools/export_review_queue.py
          python3 FFT_Android_Mod/docs/re-tools/parallel_loop.py \
            --review-only --retry-review --upgrade-v3 --workers 4 --limit 8 --timeout 120 | tee /tmp/re-v3-smoke.log
          python3 FFT_Android_Mod/docs/re-tools/structural_v3_report.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("FFT_Android_Mod/docs/re-results")
          import re
          matched = re.search(r"V3_UPGRADED=(\d+)",
                              Path("/tmp/re-v3-smoke.log").read_text())
          assert matched, "v3 smoke did not print an upgrade count"
          count = int(matched.group(1))
          assert 0 <= count <= 8
          archived = list((root / "structural-v2").glob("*.json"))
          assert len(archived) >= count, "Every replaced v2 checkpoint needs an archived original"
          for item in archived:
              prior = json.loads(item.read_text())
              new = json.loads((root / item.name).read_text())
              assert prior["pipeline_version"] == new["pipeline_version"] == 2
              assert new["structural_version"] == 3
              assert new["structural_fingerprint"]
              assert new["structural_v3"]["status"] == new["status"]
          v3 = sum(1 for item in root.glob("*.json")
                   if json.loads(item.read_text()).get("structural_version") == 3)
          report = (root / "STRUCTURAL_V3_REPORT.md").read_text()
          assert f"v3 checkpoints | {v3}" in report
          print("PASS: real ELF v3 upgrades are versioned, bounded and archived")
          PY
          # Structural upgrades change checkpoint statuses; both dependent
          # reports must be regenerated before reading the review queue.
          python3 FFT_Android_Mod/docs/re-tools/progress_report.py
          python3 FFT_Android_Mod/docs/re-tools/export_review_queue.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_evidence.py --limit 8
          python3 FFT_Android_Mod/docs/re-tools/semantic_path_report.py --limit 12
          python3 FFT_Android_Mod/docs/re-tools/semantic_microexec.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_branch_microexec.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_guarded_block.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_two_guards.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_entry_prefix.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_return_call.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_callee_v2icon.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_v2icon_execute.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_v2icon_call_flow.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_v2icon_destinations.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_three_callees_audit.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_three_callees_exec.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_sound_chain.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_sound_dispatch_audit.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_sound_icon_microexec.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_next_boundaries.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_next_pointer_microexec.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_getparam_getscale.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_getparam_getscale_exec.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_post_getter_paths.py
          python3 - <<'PY'
          from pathlib import Path
          report = Path("FFT_Android_Mod/docs/re-results/SEMANTIC_SOUND_ICON_MICROEXEC.md").read_text()
          assert "Sound dispatcher microexecutions: 10/10 PASS" in report
          assert "Icon prologue microexecutions: 10/10 PASS" in report
          assert all(x in report for x in ("0x2b2b7c", "0x2b8928",
                      "72 bytes", "not", "synthetic"))
          print("PASS: bounded ARM sound dispatch and icon-position prologue on real ELF")
          PY
          python3 - <<'PY'
          from pathlib import Path
          report = Path("FFT_Android_Mod/docs/re-results/SEMANTIC_SOUND_DISPATCH_AUDIT.md").read_text()
          assert all(t in report for t in (
              "0x2b2cf8", "0x2b8900", "0x271314",
              "SysSE_PlayDef(int)", "iOS_SetIconPosition()",
              "static audit", "not a behavioral"))
          print("PASS: original ARM sound dispatch and icon-position entry decoded")
          PY
          python3 - <<'PY'
          from pathlib import Path
          r=Path("FFT_Android_Mod/docs/re-results/SEMANTIC_SOUND_CHAIN.md").read_text()
          assert "Sound tail-branch microexecutions: 10/10 PASS" in r
          assert "0x26b374" in r and "0x2168e0" in r
          assert "sound playback" in r and "not proven" in r
          assert "Stop **before**" in r
          print("PASS: original ELF sound_request bounded direct-B chain")
          PY
          python3 - <<'PY'
          from pathlib import Path
          report = Path("FFT_Android_Mod/docs/re-results/SEMANTIC_THREE_CALLEES_EXECUTION.md").read_text()
          assert "Three-callee and caller tests: 72/72 PASS" in report
          assert all(x in report for x in (
              "0x2168e0", "0x2b8900", "index 49",
              "index 52", "synthetic", "not executed"))
          print("PASS: real ELF callee and caller machine contracts with explicit unknown targets")
          PY
          python3 - <<'PY'
          from pathlib import Path
          report = Path("FFT_Android_Mod/docs/re-results/SEMANTIC_THREE_CALLEES_AUDIT.md").read_text()
          assert all(x in report for x in (
              "0x2b9cac", "0x26b374", "0x282268",
              "iOS_setV2Icon", "sound_request", "iOS_clearOkNg",
              "Original word", "No full-function semantic equivalence"))
          print("PASS: three original ELF callee instruction audits")
          PY
          python3 - <<'PY'
          from pathlib import Path
          report = Path("FFT_Android_Mod/docs/re-results/SEMANTIC_V2ICON_DESTINATIONS.md").read_text()
          assert "Post-getter branch micro-executions: 288/288 PASS" in report
          assert all(v in report for v in (
              "0x25a2bc", "0x25a310", "0x25a328", "0x710100",
              "BL", "not the effect", "synthetic"))
          print("PASS: real ARM post-getter stores, conditional paths and boundaries")
          PY
          python3 - <<'PY'
          from pathlib import Path
          report = Path("FFT_Android_Mod/docs/re-results/SEMANTIC_V2ICON_CALL_FLOW.md").read_text()
          assert "Caller-and-callee micro-executions: 48/48 PASS" in report
          assert all(mark in report for mark in (
              "0x25a2c8", "0x25a2ac", "0x25a2f8", "0x25a298",
              "0x2b7ccc", "synthetic", "NOT complete-function"))
          print("PASS: actual ELF external BL, V2Icon getter, and caller return branches")
          PY
          python3 - <<'PY'
          from pathlib import Path
          report = (Path("FFT_Android_Mod/docs/re-results") /
                    "SEMANTIC_V2ICON_CALLEE.md").read_text(encoding="utf-8")
          assert all(token in report for token in (
              "0x25a298", "0x2b7ccc", "iOS_getV2Icon(V2ICON_DATA)",
              "Five executable ARM instructions", "No semantic equivalence claimed"))
          for address in range(0x2b7ccc, 0x2b7ccc + 20, 4):
              assert f"0x{address:x}" in report
          assert "One PC-relative literal" in report
          assert "0x2b7ce0" in report
          print("PASS: five executable V2Icon opcodes plus data literal")
          PY
          python3 - <<'PY'
          from pathlib import Path
          report = (Path("FFT_Android_Mod/docs/re-results") /
                    "SEMANTIC_V2ICON_EXECUTION.md").read_text(encoding="utf-8")
          assert "V2Icon isolated micro-executions: 120/120 PASS" in report
          assert "Exactly two 32-bit reads" in report
          assert "No memory writes" in report
          assert "synthetic" in report and "complete-function equivalence" in report
          print("PASS: original ELF V2Icon call-target getter machine execution")
          PY
          python3 - <<'PY'
          from pathlib import Path
          r = Path("FFT_Android_Mod/docs/re-results/SEMANTIC_RETURN_CALL_BOUNDARY.md").read_text()
          assert "Verified entry-to-boundary microexecutions: 2048/2048 PASS" in r
          assert "Conditional continuation slot clears:" in r
          assert "POP restores" in r and "first external BL" in r
          assert "0x67b2f8" in r and "not executed or stubbed" in r
          print("PASS: original ARM return and pre-call conditional state evidence")
          PY
          python3 - <<'PY'
          from pathlib import Path
          report = Path("FFT_Android_Mod/docs/re-results/SEMANTIC_ENTRY_PREFIX.md").read_text()
          assert "Function-entry bounded micro-executions: 1024/1024 PASS" in report
          assert all(marker in report for marker in (
              "0x347d58", "0x3479b0", "0x3479cc",
              "Early BNE", "BLE exit", "State transition",
              "not a whole-function test"))
          print("PASS: 1024 real ELF prologue-to-state-transition machine tests")
          PY
          python3 - <<'PY'
          from pathlib import Path
          report = Path("FFT_Android_Mod/docs/re-results/SEMANTIC_TWO_GUARDS.md").read_text()
          assert "Two-guard machine executions: 256/256 PASS" in report
          assert "Early BNE" in report and "BLE" in report and "Fallthrough" in report
          assert "semantic equivalence" in report and "mid-function" in report
          print("PASS: two ARM guards and global state writes from original ELF")
          PY
          python3 - <<'PY'
          from pathlib import Path
          report = Path("FFT_Android_Mod/docs/re-results/SEMANTIC_GUARDED_BLOCK.md").read_text()
          assert "Guarded block micro-executions:** 256/256 PASS" in report
          assert "BLE taken" in report and "BLE not taken" in report
          assert "needs_review" in report and "mid-function" in report
          print("PASS: genuine ELF branch-through-global-write microexecution")
          PY
          python3 - <<'PY'
          from pathlib import Path
          report = Path("FFT_Android_Mod/docs/re-results/SEMANTIC_BRANCH_MICROEXEC.md").read_text()
          assert "Total verified isolated branch executions:** 192" in report
          assert all(token in report for token in
                     ("0x2442cc", "0x244310", "0x244384", "not a full function trace"))
          print("PASS: actual ELF conditional ARM branch machine test")
          PY
          python3 - <<'PY'
          from pathlib import Path
          f = Path("FFT_Android_Mod/docs/re-results/SEMANTIC_MICROEXEC.md")
          r = f.read_text(encoding="utf-8")
          assert "Total verified machine micro-executions:** 64" in r
          assert "0x244254" in r and "0x2443b8" in r
          assert "not** semantic equivalence" in r
          print("PASS: isolated actual ARM ELF machine microexecution")
          PY
          python3 - <<'PY'
          from pathlib import Path
          report = (Path("FFT_Android_Mod/docs/re-results") /
                    "SEMANTIC_PATH_CONTRACTS.md").read_text(encoding="utf-8")
          import hashlib
          import json
          base = Path("FFT_Android_Mod")
          checkpoint = json.loads(
              (base / "docs/re-results/00244200.json").read_text())
          elf_hash = hashlib.sha256(
              (base / "src/lib/armeabi/libgl2jni.so").read_bytes()).hexdigest()
          assert checkpoint["binary_sha256"] == elf_hash
          if "0x2442c8" in report and "0x2442cc" in report:
              assert "0x244254" in report and "0x40" in report
              assert "Modeled ARM CFG nodes:" in report
              assert "Entry-relative modeled dominators:" in report
              assert "not global or dynamic dominance" in report
              assert "Modeled direct predecessors:" in report
              assert ("NOT a dominance or impossibility proof" in report or
                      "Both modeled successors can reach the write" in report)
          else:
              # A successful structural v3 upgrade legitimately removes this
              # function from the pending-review-only semantic path report.
              assert checkpoint["status"] == "auto_structural"
              assert checkpoint.get("structural_version") == 3
              print("vEnd_rollproc promoted; detailed original-ELF opcode "
                    "checks remain in the following independent test")
          print("PASS: real ARM branching and bitmask semantic contracts")
          PY
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("FFT_Android_Mod/docs/re-tools").resolve()))
          import semantic_evidence as evidence
          import semantic_facts as facts
          elf = evidence.ROOT / "src/lib/armeabi/libgl2jni.so"
          seen, _, _ = evidence.collect(evidence.read_function(elf, 0x244200, 528), 0x244200)
          effects = facts.bitmask_effects(seen)
          assert any(f["kind"] == "clear_bits" and f["mask"] == 0x40
                     and f["addresses"] == [0x244254, 0x244258, 0x24425c]
                     for f in effects), "Expected vEnd_rollproc local flag clear not found"
          true_calls = {address for address, _ in facts.calls(seen)}
          assert 0x244204 in true_calls, "Expected BL missing"
          assert 0x244358 not in true_calls, "BLE misclassified as function call"
          print("PASS: real ELF local bitmask effect and BL/BLE distinction")
          PY
      - name: Audit sound and icon next boundaries from real ELF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          report = Path("FFT_Android_Mod/docs/re-results/SEMANTIC_NEXT_BOUNDARIES.md").read_text()
          assert all(x in report for x in (
              "0x2b2b7c", "0x2b8928", "linear", "not a demonstrated",
              "semantic equivalence"))
          print(report)
          PY
      - name: Verify next sound and icon pointer contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          report=Path("FFT_Android_Mod/docs/re-results/SEMANTIC_NEXT_POINTER_MICROEXEC.md").read_text()
          assert all(value in report for value in (
              "Sound next-boundary microexecutions: **30/30 PASS**",
              "Icon first-global-read microexecutions: **30/30 PASS**",
              "0x2b2b98", "0x2b8938", "not executed"))
          print("PASS: 60 machine executions through sound/icon pointer loads on original ELF")
          PY
      - name: Verify original GetParam and GetScale ARM call sites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          report=Path("FFT_Android_Mod/docs/re-results/SEMANTIC_GETPARAM_GETSCALE_AUDIT.md").read_text()
          assert all(x in report for x in (
              "0x28c320", "0xa6f28", "0x2b2b98", "0x2b8938",
