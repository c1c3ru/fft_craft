      - name: Verify original GetParam/GetScale machine contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          report=Path("FFT_Android_Mod/docs/re-results/SEMANTIC_GETPARAM_GETSCALE_MICROEXEC.md").read_text()
          assert all(x in report for x in (
              "GetParam microexecutions: 64/64 PASS",
              "GetScale microexecutions: 32/32 PASS",
              "Combined GetParam/GetScale microexecutions: 96/96 PASS",
              "synthetic inputs", "NOT a complete semantic-equivalence"))
          print("PASS: 96 original ELF ARM getter and linked-call microexecutions")
          PY
      - name: Verify original ARM post-getter caller paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          report=Path("FFT_Android_Mod/docs/re-results/SEMANTIC_POST_GETTER_PATHS.md").read_text()
          assert all(x in report for x in (
              "Post-getter ARM microexecutions: 32/32 PASS",
              "0x2b2bc0", "0x2b2bc8", "0x2b2bac",
              "0x2b8948", "synthetic inputs", "not executed"))
          print("PASS: 32 real ELF ARM post-getter decisions and next-call argument tests")
          PY
      - name: Validate central project dashboard on real ELF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 FFT_Android_Mod/docs/re-tools/status_geral.py
          python3 - <<'PY'
          from pathlib import Path
          report = Path("FFT_Android_Mod/docs/re-results/STATUS_GERAL.md").read_text(encoding="utf-8")
          assert all(marker in report for marker in (
              "Aprovação estrutural entre checkpoints",
              "Equivalência semântica integral registrada",
              "Certificados semânticos registrados",
              "Não somamos esses conjuntos",
              "Próximas prioridades",
              "0x2b2b7c",
              "0x2b8928",
              "SEMANTIC_EVIDENCE_INDEX.md",
              "GitHub Actions"))
          assert "Cobertura semântica por endereço" in report
          assert "Cobertura semântica por bytes únicos" in report
          assert "Endereços com evidência parcial no lote de referência" in report
          print("PASS: same-ELF dashboard retains structural/semantic distinction")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverse-engineering-report
          path: FFT_Android_Mod/docs/re-results/
          if-no-files-found: warn
          retention-days: 14
