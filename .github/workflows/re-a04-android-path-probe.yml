name: A04 Android Context path lengths using actual JNI

on:
  pull_request:
    paths:
      - '.github/workflows/re-a04-android-path-probe.yml'
      - 'FFT_Android_Mod/docs/re-tools/android-path-probe/**'
      - 'FFT_Android_Mod/docs/re-tools/android-path-probe/compare-api-matrix.py'
      - 'FFT_Android_Mod/docs/re-tools/android-path-probe/test_compare_api_matrix.py'
  workflow_dispatch:

permissions:
  contents: read

# Cancel only superseded PR checks. Manual full Android matrices remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run API matrix parser regression tests without Android SDK or emulator
        run: |
          set -euo pipefail
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools/android-path-probe -p 'test_compare_api_matrix.py' -v
          python3 -m py_compile FFT_Android_Mod/docs/re-tools/android-path-probe/compare-api-matrix.py

  build-test-only-probe-apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK/NDK for isolated measurement APK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Compile debug-only APK under the same package ID as the game
        run: |
          gradle --no-daemon --stacktrace --project-dir FFT_Android_Mod/docs/re-tools/android-path-probe :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: a04-test-only-android-path-apk
          path: FFT_Android_Mod/docs/re-tools/android-path-probe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  measure-on-emulator:
    if: github.event_name == 'workflow_dispatch'
    needs: build-test-only-probe-apk
    strategy:
      fail-fast: false
      matrix:
        api_level: [23, 29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: a04-test-only-android-path-apk
          path: probe-apk
      - name: Enable Linux KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Sample internal/external path bytes via Android JNI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          script: bash FFT_Android_Mod/docs/re-tools/android-path-probe/run-emulator.sh probe-apk/app-debug.apk a04-android-api-${{ matrix.api_level }}.json ${{ matrix.api_level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a04-android-api-${{ matrix.api_level }}-path-byte-evidence
          path: a04-android-api-${{ matrix.api_level }}.json
          if-no-files-found: warn
          retention-days: 30

  compare-api-measurements:
    if: github.event_name == 'workflow_dispatch'
    needs: measure-on-emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download all API-level-only path measurements
        uses: actions/download-artifact@v4
        with:
          pattern: a04-android-api-*-path-byte-evidence
          path: /tmp/a04-api-matrix
      - name: Validate aggregator fail-closed regression cases
        run: |
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools/android-path-probe -p 'test_compare_api_matrix.py' -v
      - name: Compare measured JNI byte counts (observations, not universal bounds)
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/android-path-probe/compare-api-matrix.py \
            --input /tmp/a04-api-matrix \
            --output /tmp/a04-api-matrix-summary.json \
            --expected-apis 23 29 35
          cat /tmp/a04-api-matrix-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: a04-android-api-matrix-summary
          path: /tmp/a04-api-matrix-summary.json
          retention-days: 30
