name: A04 Android Context path lengths using actual JNI

on:
  pull_request:
    paths:
      - '.github/workflows/re-a04-android-path-probe.yml'
      - 'FFT_Android_Mod/docs/re-tools/android-path-probe/**'
      - 'FFT_Android_Mod/docs/re-results/A04_ANDROID_EMULATOR_PATHS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-only-probe-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK/NDK for isolated measurement APK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Compile debug-only APK under the same package ID as the game
        run: |
          gradle --no-daemon --stacktrace --project-dir FFT_Android_Mod/docs/re-tools/android-path-probe :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: a04-test-only-android-path-apk
          path: FFT_Android_Mod/docs/re-tools/android-path-probe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  measure-on-emulator:
    needs: build-test-only-probe-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: a04-test-only-android-path-apk
          path: probe-apk
      - name: Enable Linux KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Sample internal/external path bytes via Android JNI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          script: bash FFT_Android_Mod/docs/re-tools/android-path-probe/run-emulator.sh probe-apk/app-debug.apk a04-android-emulator.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a04-android-emulator-path-byte-evidence
          path: a04-android-emulator.json
          if-no-files-found: warn
          retention-days: 30
