name: A04 external callee 714a0 original ELF audit

on:
  pull_request:
    paths:
      - '.github/workflows/re-a04-714a0-audit.yml'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_714a0_audit.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a04_714a0_audit.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_714a0_slot.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a04_714a0_slot.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_714a0_strcpy.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a04_714a0_strcpy.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_714a0_postcopy.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a04_714a0_postcopy.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_b942c_strlen.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a04_b942c_strlen.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_b8be4_audit.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a04_b8be4_audit.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_sjis_differential.py'
      - 'FFT_Android_Mod/docs/re-tools/c-models/a04_sjis_lead.c'
      - 'FFT_Android_Mod/docs/re-tools/c-models/a04_sjis_slash_loop.c'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_sjis_loop_differential.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_nonzero_full_differential.py'
      - 'FFT_Android_Mod/docs/re-tools/c-models/a04_nonzero_full.c'
      - 'FFT_Android_Mod/docs/re-results/A04_STRING_NORMALIZATION_SEMANTICS.md'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_callee_cfg.py'
      - 'FFT_Android_Mod/src/lib/armeabi/libgl2jni.so'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-elf-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ARM disassembly tools
        run: python3 -m pip install capstone pyelftools unicorn
      - name: Test verifier
        run: |
          set -euo pipefail
          PYTHONPATH=FFT_Android_Mod/docs/re-tools python3 -m unittest -v test_semantic_a04_714a0_audit test_semantic_a04_714a0_slot test_semantic_a04_714a0_strcpy test_semantic_a04_714a0_postcopy test_semantic_a04_b942c_strlen test_semantic_a04_b8be4_audit
      - name: Verify original ELF and candidate CFG
        run: |
          set -euo pipefail
          mkdir -p /tmp/fft-a04-714a0
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_714a0_audit.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --checkpoint /tmp/fft-a04-714a0/state.json \
            --report /tmp/fft-a04-714a0/report.md
          cp /tmp/fft-a04-714a0/state.json /tmp/fft-a04-714a0/first.json
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_714a0_audit.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --checkpoint /tmp/fft-a04-714a0/state.json \
            --report /tmp/fft-a04-714a0/report.md
          cmp /tmp/fft-a04-714a0/first.json /tmp/fft-a04-714a0/state.json
          cat /tmp/fft-a04-714a0/report.md
      - name: Locate original ELF relocation and bounded 714a0 veneer semantics
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_714a0_slot.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --checkpoint /tmp/fft-a04-714a0/got-slot.json \
            --report /tmp/fft-a04-714a0/got-slot.md
          cp /tmp/fft-a04-714a0/got-slot.json /tmp/fft-a04-714a0/first-got-slot.json
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_714a0_slot.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --checkpoint /tmp/fft-a04-714a0/got-slot.json \
            --report /tmp/fft-a04-714a0/got-slot.md
          cmp /tmp/fft-a04-714a0/got-slot.json /tmp/fft-a04-714a0/first-got-slot.json
      - name: Verify imported strcpy and expose original caller continuation
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_714a0_strcpy.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --output /tmp/fft-a04-714a0/strcpy-caller.json
      - name: Decode next original callee after strcpy
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_714a0_postcopy.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --output /tmp/fft-a04-714a0/postcopy.json
      - name: Verify next original libc import and post-strlen CFG
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_b942c_strlen.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --output /tmp/fft-a04-714a0/strlen.json
      - name: Inspect original nested callee and inner loop
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_b8be4_audit.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --output /tmp/fft-a04-714a0/nested-b8be4.json
      - name: Differential original ARM Shift-JIS lead classifier against independent C
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_sjis_differential.py
      - name: Differential original Shift-JIS string loop with bounded strlen stub
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_sjis_loop_differential.py
      - name: Differential entire original A04 nonzero caller with controlled libc imports
        run: |
          set -euo pipefail
          python3 -m py_compile FFT_Android_Mod/docs/re-tools/semantic_a04_nonzero_full_differential.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_nonzero_full_differential.py | tee /tmp/fft-a04-714a0/nonzero-whole-caller-result.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: a04-714a0-original-cfg
          path: /tmp/fft-a04-714a0/
          retention-days: 30
