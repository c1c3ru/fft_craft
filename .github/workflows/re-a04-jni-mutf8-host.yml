name: A04 actual host JNI modified UTF-8 byte gates

on:
  pull_request:
    paths:
      - '.github/workflows/re-a04-jni-mutf8-host.yml'
      - 'FFT_Android_Mod/docs/re-tools/jni-path-probe/**'
      - 'FFT_Android_Mod/docs/re-tools/c-models/a04_rootpath_safe.c'
      - 'FFT_Android_Mod/docs/re-results/A04_JNI_RUNTIME_BOUND.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-jni-mutf8:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile native JNI probe and independent bounded A04 C reconstruction
        run: |
          set -euo pipefail
          mkdir -p /tmp/a04-jni/classes /tmp/a04-jni/native
          gcc -std=c11 -O2 -fPIC -shared -Wall -Wextra -Werror \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            FFT_Android_Mod/docs/re-tools/jni-path-probe/a04_jni_probe.c \
            FFT_Android_Mod/docs/re-tools/c-models/a04_rootpath_safe.c \
            -o /tmp/a04-jni/native/liba04_jni_probe.so
          javac --release 17 -d /tmp/a04-jni/classes \
            FFT_Android_Mod/docs/re-tools/jni-path-probe/org/fftcraft/a04/A04JniByteProbe.java
      - name: Validate JNI GetStringUTFLength/Chars and 242/243 byte cutoff
        run: |
          set -euo pipefail
          java -ea -Djava.library.path=/tmp/a04-jni/native \
            -cp /tmp/a04-jni/classes org.fftcraft.a04.A04JniByteProbe \
            | tee /tmp/a04-jni/report.txt
          grep -qx 'A04_JNI_HOST_CASES=271' /tmp/a04-jni/report.txt
          grep -qx 'A04_JNI_MODIFIED_UTF8_CONFIRMED=1' /tmp/a04-jni/report.txt
          grep -qx 'A04_JNI_REAL_ANDROID_PATH_SAMPLES=0' /tmp/a04-jni/report.txt
          cp /tmp/a04-jni/report.txt /tmp/a04-jni/first.txt
          java -ea -Djava.library.path=/tmp/a04-jni/native \
            -cp /tmp/a04-jni/classes org.fftcraft.a04.A04JniByteProbe \
            > /tmp/a04-jni/report.txt
          cmp /tmp/a04-jni/first.txt /tmp/a04-jni/report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: a04-real-host-jni-jdk-${{ matrix.java }}
          path: /tmp/a04-jni/report.txt
          retention-days: 30
