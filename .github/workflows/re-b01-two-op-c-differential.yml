name: B01 A32 source sections and two-op C differential

on:
  pull_request:
    paths:
      - '.github/workflows/re-b01-two-op-c-differential.yml'
      - 'FFT_Android_Mod/docs/re-tools/b01_source_section_partition.py'
      - 'FFT_Android_Mod/docs/re-tools/b01_two_op_c_differential.py'
      - 'FFT_Android_Mod/docs/re-tools/c-models/b01_two_op.c'
      - 'FFT_Android_Mod/docs/re-tools/test_b01_two_op_c_diff.py'
      - 'FFT_Android_Mod/docs/re-results/B01_TWO_OP_C_EVIDENCE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  b01-c11-two-op-host:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ELF and microexecution dependencies
        run: python -m pip install --disable-pip-version-check 'capstone==5.0.6' 'pyelftools==0.32' 'unicorn==2.1.3'
      - name: Compile C independently and run fail-closed synthetic tests
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fPIC -shared \
            FFT_Android_Mod/docs/re-tools/c-models/b01_two_op.c -o /tmp/b01-two-op.so
          python -m py_compile FFT_Android_Mod/docs/re-tools/b01_source_section_partition.py \
            FFT_Android_Mod/docs/re-tools/b01_two_op_c_differential.py
          python -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_b01_two_op_c_diff.py' -v
      - name: Partition all 2126 raw ELF xrefs by ELF section and declared owner
        run: |
          set -euo pipefail
          python FFT_Android_Mod/docs/re-tools/b01_source_section_partition.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --inventory FFT_Android_Mod/docs/RE_FUNCTION_INVENTORY.csv \
            --checkpoints FFT_Android_Mod/docs/re-results \
            --output /tmp/b01-source-sections.json
      - name: Execute only two-opcode safe original ARM prefixes vs independent C model
        run: |
          set -euo pipefail
          python FFT_Android_Mod/docs/re-tools/b01_two_op_c_differential.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --inventory FFT_Android_Mod/docs/RE_FUNCTION_INVENTORY.csv \
            --model FFT_Android_Mod/docs/re-tools/c-models/b01_two_op.c \
            --output /tmp/b01-two-op-c-diff.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/b01-source-sections.json').read_text())
          d=json.loads(Path('/tmp/b01-two-op-c-diff.json').read_text())
          assert s['xref_candidate_count'] == 2126
          assert sum(s['partition_counts'].values()) == 2126
          assert s['original_source_evidence_tiers']['no_inventory_owner'] == 962
          assert s['original_source_evidence_tiers']['unresolved_source'] == 1164
          assert not s['confirmed_instructions'] and not s['confirmed_call_edges']
          assert d['unique_entrypoints_scanned'] == 6329
          assert d['safe_two_opcode_entries'] >= 1, 'No real ELF two-op prefix tested'
          assert d['safe_two_opcode_entries'] <= 32
          assert d['bounded_samples_passed'] == 12 * d['safe_two_opcode_entries']
          assert d['new_semantic_certificates'] == 0 and not d['whole_function_equivalence_proven']
          assert d['B01_done'] is False and s['B01_done'] is False
          print('B01_ELF_SECTION_AND_TWO_OPCODE_C_GATE=PASS')
          print('B01_C_VERIFIED_PREFIXES='+str(d['safe_two_opcode_entries']))
          print('B01_C_DIFFERENTIAL_SAMPLES='+str(d['bounded_samples_passed']))
          print('B01_FULL_FUNCTION_CERTIFICATES=0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-elf-source-sections-two-op-c-evidence
          path: |
            /tmp/b01-source-sections.json
            /tmp/b01-two-op-c-diff.json
          if-no-files-found: warn
          retention-days: 30
