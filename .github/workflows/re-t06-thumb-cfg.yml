name: T06 Thumb CFG and C++ wrapper differential

on:
  pull_request:
    paths:
      - '.github/workflows/re-t06-thumb-cfg.yml'
      - 'FFT_Android_Mod/docs/re-tools/structural_v3.py'
      - 'FFT_Android_Mod/docs/re-tools/test_structural_v3.py'
      - 'FFT_Android_Mod/docs/re-tools/t06_thumb_wrapper_differential.py'
      - 'FFT_Android_Mod/docs/re-tools/test_t06_thumb_wrapper_differential.py'
      - 'FFT_Android_Mod/docs/re-tools/c-models/t06_thumb_wrapper_model.cpp'
      - 'FFT_Android_Mod/docs/re-baseline/T06_THUMB_WRAPPER_CFG_CONTRACTS.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/re-t06-thumb-cfg.yml'
      - 'FFT_Android_Mod/docs/re-tools/structural_v3.py'
      - 'FFT_Android_Mod/docs/re-tools/t06_thumb_wrapper_differential.py'
      - 'FFT_Android_Mod/docs/re-tools/test_t06_thumb_wrapper_differential.py'
      - 'FFT_Android_Mod/docs/re-tools/c-models/t06_thumb_wrapper_model.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t06-thumb-cfg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/ci/requirements-arm-re.txt
      - name: Install existing bounded ARM dependencies
        run: python3 -m pip install --disable-pip-version-check -r .github/ci/requirements-arm-re.txt
      - name: Check structural A32 regressions and conservative Thumb review
        run: |
          set -euo pipefail
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools \
            -p 'test_structural_v3.py' -v
      - name: Exercise original Thumb CFG, conditional branch and stack
        run: |
          set -euo pipefail
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools \
            -p 'test_t06_thumb_wrapper_differential.py' -v
      - name: Compile isolated C++ model with strict diagnostics
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            FFT_Android_Mod/docs/re-tools/c-models/t06_thumb_wrapper_model.cpp \
            -o "$RUNNER_TEMP/t06-wrapper-model"
      - name: Differential test original wrapper vs independent C++ callback models
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/t06_thumb_wrapper_differential.py \
            --cpp-exe "$RUNNER_TEMP/t06-wrapper-model" \
            --output "$RUNNER_TEMP/t06-wrapper-contracts.json" \
            | tee "$RUNNER_TEMP/t06-wrapper-gates.txt"
          grep -qx 'T06_WRAPPER_DIFFERENTIAL_SCENARIOS_PASSED=7' "$RUNNER_TEMP/t06-wrapper-gates.txt"
          grep -qx 'T06_WRAPPER_NEW_CERTIFICATES=0' "$RUNNER_TEMP/t06-wrapper-gates.txt"
          python3 - "$RUNNER_TEMP/t06-wrapper-contracts.json" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          assert d['wrapper_slices_tested']==2
          assert d['differential_scenarios_passed']==7
          assert d['new_semantic_certificates']==0
          assert d['new_structural_approvals']==0
          assert d['real_external_callees_untested']
          assert not d['T06_done']
          assert d['wrappers'][1]['unattributed_trailing_symbol_bytes']==12
          print('T06_WRAPPER_EVIDENCE_GATES=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: t06-thumb-wrapper-original-elf-cpp-contracts
          path: ${{ runner.temp }}/t06-wrapper-contracts.json
          retention-days: 14
          if-no-files-found: error
