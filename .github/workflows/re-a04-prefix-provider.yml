name: A04 original prefix provider 0x2b04f0

on:
  pull_request:
    paths:
      - '.github/workflows/re-a04-prefix-provider.yml'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_prefix_provider.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_rootpath_field.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a04_rootpath_field.py'
      - 'FFT_Android_Mod/docs/re-results/A04_PREFIX_PROVIDER.md'
      - 'FFT_Android_Mod/src/lib/armeabi/libgl2jni.so'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-prefix-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original ARM disassembler
        run: python3 -m pip install capstone pyelftools unicorn
      - name: Audit original prefix function, repeat exact checkpoint
        run: |
          set -euo pipefail
          mkdir -p /tmp/a04-prefix
          python3 -m py_compile FFT_Android_Mod/docs/re-tools/semantic_a04_prefix_provider.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_prefix_provider.py --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so --checkpoint /tmp/a04-prefix/provider.json
          cp /tmp/a04-prefix/provider.json /tmp/a04-prefix/first.json
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_prefix_provider.py --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so --checkpoint /tmp/a04-prefix/provider.json
          cmp /tmp/a04-prefix/first.json /tmp/a04-prefix/provider.json
      - name: Original getter differential and initializer import provenance
        run: |
          set -euo pipefail
          PYTHONPATH=FFT_Android_Mod/docs/re-tools python3 -m unittest -v test_semantic_a04_rootpath_field
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_rootpath_field.py --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so --checkpoint /tmp/a04-prefix/rootpath.json
          cp /tmp/a04-prefix/rootpath.json /tmp/a04-prefix/rootpath-first.json
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_rootpath_field.py --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so --checkpoint /tmp/a04-prefix/rootpath.json
          cmp /tmp/a04-prefix/rootpath-first.json /tmp/a04-prefix/rootpath.json
      - uses: actions/upload-artifact@v4
        with:
          name: a04-original-prefix-provider-2b04f0
          path: /tmp/a04-prefix/
          retention-days: 30
