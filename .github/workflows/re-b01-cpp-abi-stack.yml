name: B01 seven C++ bodies and stack-return contracts

on:
  pull_request:
    paths:
      - '.github/workflows/re-b01-cpp-abi-stack.yml'
      - 'FFT_Android_Mod/docs/re-tools/b01_seven_cpp_contracts.py'
      - 'FFT_Android_Mod/docs/re-tools/b01_pop_pc_differential.py'
      - 'FFT_Android_Mod/docs/re-tools/c-models/b01_pop_pc.c'
      - 'FFT_Android_Mod/docs/re-tools/test_b01_cpp_abi_pop_pc.py'
      - 'FFT_Android_Mod/docs/re-results/B01_CPP_ABI_STACK_CONTRACTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  seven-abi-and-stack-return:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned host-only ARM tools
        run: |
          python -m pip install --disable-pip-version-check \
            'capstone==5.0.6' 'pyelftools==0.32' 'unicorn==2.1.3'
      - name: Compile C11 and verify synthetic safety regressions
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -fPIC -shared FFT_Android_Mod/docs/re-tools/c-models/b01_pop_pc.c \
            -o /tmp/b01-pop-pc.so
          python -m py_compile \
            FFT_Android_Mod/docs/re-tools/b01_seven_cpp_contracts.py \
            FFT_Android_Mod/docs/re-tools/b01_pop_pc_differential.py
          python -m unittest discover -s FFT_Android_Mod/docs/re-tools \
            -p 'test_b01_cpp_abi_pop_pc.py' -v
      - name: Derive seven C++ ABI hypotheses and exercise exact original function bodies
        run: |
          set -euo pipefail
          python FFT_Android_Mod/docs/re-tools/b01_seven_cpp_contracts.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --inventory FFT_Android_Mod/docs/RE_FUNCTION_INVENTORY.csv \
            --output /tmp/b01-seven-cpp-contracts.json
      - name: Emulate isolated POP PC stack returns and preserve unknown caller frames
        run: |
          set -euo pipefail
          python FFT_Android_Mod/docs/re-tools/b01_pop_pc_differential.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --inventory FFT_Android_Mod/docs/RE_FUNCTION_INVENTORY.csv \
            --output /tmp/b01-pop-pc-contracts.json
          python - <<'PY'
          import json
          from pathlib import Path
          cpp=json.loads(Path('/tmp/b01-seven-cpp-contracts.json').read_text())
          pop=json.loads(Path('/tmp/b01-pop-pc-contracts.json').read_text())
          assert cpp['verified_12_byte_entrypoints']==7
          assert cpp['scenarios_per_entry']==96
          assert cpp['bounded_original_vs_c_scenarios_passed']==672
          assert all(not x['field_name_and_class_layout_verified']
                     and not x['universally_proven']
                     and not x['semantic_certificate_issued']
                     and x['declared_body_executed_all_scenarios']
                     for x in cpp['entrypoints'])
          assert pop['stack_return_occurrences_in_recursive_paths']==28
          assert pop['unique_pop_pc_addresses']<=28
          assert pop['eligible_stack_return_addresses']>=1
          assert pop['bounded_differentials_passed']==8*pop['eligible_stack_return_addresses']
          assert pop['new_semantic_certificates']==0 and pop['B01_done'] is False
          assert cpp['whole_function_semantic_certificates_added']==0 and cpp['B01_done'] is False
          print('B01_CPP_ABI_STACK_GATE=PASS')
          print('B01_CPP_ORIGINAL_BODIES='+str(cpp['verified_12_byte_entrypoints']))
          print('B01_CPP_DIFFERENTIALS='+str(cpp['bounded_original_vs_c_scenarios_passed']))
          print('B01_STACK_UNIQUE_RETURNS='+str(pop['unique_pop_pc_addresses']))
          print('B01_STACK_SAMPLES='+str(pop['bounded_differentials_passed']))
          print('B01_FORMAL_CERTIFICATES_ADDED=0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-cpp-abi-stack-return-evidence
          path: |
            /tmp/b01-seven-cpp-contracts.json
            /tmp/b01-pop-pc-contracts.json
          if-no-files-found: warn
          retention-days: 30
