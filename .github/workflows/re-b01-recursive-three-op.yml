name: B01 recursive group paths and 3-op C11 differential

on:
  pull_request:
    paths:
      - '.github/workflows/re-b01-recursive-three-op.yml'
      - 'FFT_Android_Mod/docs/re-tools/b01_recursive_group_paths.py'
      - 'FFT_Android_Mod/docs/re-tools/b01_three_op_c_differential.py'
      - 'FFT_Android_Mod/docs/re-tools/c-models/b01_three_op.c'
      - 'FFT_Android_Mod/docs/re-tools/test_b01_recursive_three_op.py'
      - 'FFT_Android_Mod/docs/re-results/B01_RECURSIVE_THREE_OP.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  b01-recursive-three-op:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned host ARM tooling
        run: |
          python -m pip install --disable-pip-version-check \
            'capstone==5.0.6' 'pyelftools==0.32' 'unicorn==2.1.3'
      - name: Compile C model and execute negative ARM/Unicorn regressions
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -fPIC -shared -Wall -Wextra -Werror -pedantic \
            FFT_Android_Mod/docs/re-tools/c-models/b01_two_op.c \
            FFT_Android_Mod/docs/re-tools/c-models/b01_three_op.c \
            -o /tmp/b01-three-op.so
          python -m py_compile \
            FFT_Android_Mod/docs/re-tools/b01_recursive_group_paths.py \
            FFT_Android_Mod/docs/re-tools/b01_three_op_c_differential.py
          python -m unittest discover -s FFT_Android_Mod/docs/re-tools \
            -p 'test_b01_recursive_three_op.py' -v
      - name: Analyze all nine overlapping ARM groups with bounded recursive CFG
        run: |
          set -euo pipefail
          python FFT_Android_Mod/docs/re-tools/b01_recursive_group_paths.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --inventory FFT_Android_Mod/docs/RE_FUNCTION_INVENTORY.csv \
            --output /tmp/b01-recursive-group-paths.json
      - name: Compare original 3-op ALU/memory/return prefixes against independent C11
        run: |
          set -euo pipefail
          python FFT_Android_Mod/docs/re-tools/b01_three_op_c_differential.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --inventory FFT_Android_Mod/docs/RE_FUNCTION_INVENTORY.csv \
            --output /tmp/b01-three-op-c-differential.json
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('/tmp/b01-recursive-group-paths.json').read_text())
          diff=json.loads(Path('/tmp/b01-three-op-c-differential.json').read_text())
          assert cfg['group_count']==9 and cfg['entrypoint_count']==21
          assert not cfg['all_groups_cfg_proven'] and not cfg['all_indirect_edges_resolved']
          assert cfg['new_semantic_certificates']==0 and cfg['B01_done'] is False
          assert diff['unique_entries_scanned']==6329
          assert diff['three_opcode_eligible'] <= 40
          assert diff['samples_passed']==12*diff['three_opcode_eligible']
          assert diff['whole_function_certificates']==0 and diff['B01_done'] is False
          assert diff['indirect_non_lr_paths_executed']==0
          print('B01_RECURSIVE_THREE_OP_GATE=PASS')
          print('B01_THREE_OP_REAL_PREFIXES='+str(diff['three_opcode_eligible']))
          print('B01_THREE_OP_BXLR_PREFIXES='+str(diff['return_prefix_candidates']))
          print('B01_FULL_FUNCTION_CERTIFICATES=0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-recursive-three-op-original-elf-evidence
          path: |
            /tmp/b01-recursive-group-paths.json
            /tmp/b01-three-op-c-differential.json
          if-no-files-found: warn
          retention-days: 30
