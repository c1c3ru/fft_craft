name: B01 source provenance and safe ALU differential

on:
  pull_request:
    paths:
      - '.github/workflows/re-b01-source-differential.yml'
      - 'FFT_Android_Mod/docs/re-tools/b01_source_evidence_filter.py'
      - 'FFT_Android_Mod/docs/re-tools/b01_safe_alu_differential.py'
      - 'FFT_Android_Mod/docs/re-tools/test_b01_source_differential.py'
      - 'FFT_Android_Mod/docs/re-tools/b01_overlap_cfg_callers.py'
      - 'FFT_Android_Mod/docs/re-results/B01_SOURCE_PROVENANCE_DIFF.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  b01-source-v3-and-one-step-alu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ELF and emulation dependencies
        run: python -m pip install --disable-pip-version-check 'capstone==5.0.6' 'pyelftools==0.32' 'unicorn==2.1.3'
      - name: Strict negative and bounded original-ALU regression suite
        run: |
          set -euo pipefail
          python -m py_compile FFT_Android_Mod/docs/re-tools/b01_source_evidence_filter.py FFT_Android_Mod/docs/re-tools/b01_safe_alu_differential.py
          python -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_b01_source_differential.py' -v
      - name: Classify all raw A32 xrefs without counting unknown code as confirmed
        run: |
          set -euo pipefail
          python FFT_Android_Mod/docs/re-tools/b01_source_evidence_filter.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --inventory FFT_Android_Mod/docs/RE_FUNCTION_INVENTORY.csv \
            --results FFT_Android_Mod/docs/re-results \
            --output /tmp/b01-source-evidence.json
      - name: Differential one safe opcode at each eligible ELF entrypoint
        run: |
          set -euo pipefail
          python FFT_Android_Mod/docs/re-tools/b01_safe_alu_differential.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --inventory FFT_Android_Mod/docs/RE_FUNCTION_INVENTORY.csv \
            --output /tmp/b01-alu-differential.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/b01-source-evidence.json').read_text())
          d=json.loads(Path('/tmp/b01-alu-differential.json').read_text())
          assert s['all_linear_sweep_candidates'] == 2126, 'Source count drift requires explicit triage'
          assert sum(s['tier_counts'].values()) == 2126
          assert s['confirmed_runtime_callers'] == 0
          assert s['confirmed_executable_source_instructions'] == 0
          assert d['entries_examined'] == 21
          assert d['single_instruction_samples_passed'] == 10 * d['safe_ALU_entries']
          assert d['new_semantic_certificates'] == 0 and d['B01_done'] is False
          assert not d['original_function_equivalence_proven']
          print('B01_SOURCE_PROVENANCE_GATE=PASS')
          print('B01_STATICALLY_ANCHORED_CANDIDATES='+str(s['tier_counts'].get('structurally_anchored_candidate',0)))
          print('B01_SAFE_ONE_STEP_DIFFERENTIAL_SAMPLES='+str(d['single_instruction_samples_passed']))
          print('B01_FUNCTION_CERTIFICATES_ISSUED=0')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b01-source-provenance-and-alu-evidence
          path: |
            /tmp/b01-source-evidence.json
            /tmp/b01-alu-differential.json
          retention-days: 30
          if-no-files-found: error
