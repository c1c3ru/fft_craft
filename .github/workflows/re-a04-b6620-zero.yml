name: A04 original ARM R1 zero path vs C

on:
  pull_request:
    paths:
      - '.github/workflows/re-a04-b6620-zero.yml'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_b6620_zero_differential.py'
      - 'FFT_Android_Mod/docs/re-tools/c-models/a04_b6620_zero.c'
      - 'FFT_Android_Mod/src/lib/armeabi/libgl2jni.so'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-zero-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original ARM emulation dependencies
        run: python3 -m pip install unicorn capstone pyelftools
      - name: Test 0xb6620 original ARM vs C for bounded R1 zero path
        run: |
          set -euo pipefail
          python3 -m py_compile FFT_Android_Mod/docs/re-tools/semantic_a04_b6620_zero_differential.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_b6620_zero_differential.py
