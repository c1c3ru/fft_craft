name: Real ELF semantic manifest audit (250)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/ci/requirements-arm-re.txt'
      - '.github/workflows/re-semantic-real-elf-250.yml'
      - 'FFT_Android_Mod/docs/re-tools/semantic_manifest_audit.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_loop_250.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_remaining_34.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a01_memory_21.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a02_branch_11.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a02_branch_11.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_destinations.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a04_destinations.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_dispatcher_exec.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a04_dispatcher_exec.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_veneer_exec.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a04_veneer_exec.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_conditional_exec.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_a04_bl_boundaries.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a04_bl_boundaries.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a04_conditional_exec.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_a01_memory_21.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_remaining_34.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_loop_250.py'
      - 'FFT_Android_Mod/docs/re-tools/test_semantic_manifest_audit.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_work_queue.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_pilot.py'
      - 'FFT_Android_Mod/docs/re-tools/semantic_evidence.py'
      - 'FFT_Android_Mod/docs/RE_FUNCTION_INVENTORY.csv'
      - 'FFT_Android_Mod/docs/re-results/semantic-certificates.json'
      - 'FFT_Android_Mod/src/lib/armeabi/libgl2jni.so'

# Limit obsolete CI runs to the latest revision of each pull request.
# Keep manually dispatched runs independent of cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  real-elf-250:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/ci/requirements-arm-re.txt'
      - name: Install ARM inspection dependencies
        run: python3 -m pip install -r .github/ci/requirements-arm-re.txt
      - name: Compile tools and execute synthetic verifier regressions
        run: |
          set -euo pipefail
          python3 -m compileall -q FFT_Android_Mod/docs/re-tools
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_semantic_manifest_audit.py' -v
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_semantic_loop_250.py' -v
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_semantic_remaining_34.py' -v
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_semantic_a01_memory_21.py' -v
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_semantic_a02_branch_11.py' -v
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_semantic_a04_destinations.py' -v
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_semantic_a04_dispatcher_exec.py' -v
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_semantic_a04_veneer_exec.py' -v
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_semantic_a04_conditional_exec.py' -v
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_semantic_a04_bl_boundaries.py' -v
      - name: Check certificates independently (never add any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 FFT_Android_Mod/docs/re-tools/semantic_certificate_gate.py
      - name: Generate 25 manifests for 250 uncertified entrypoints
        run: |
          set -euo pipefail
          mkdir -p /tmp/fft-real-250
          python3 FFT_Android_Mod/docs/re-tools/semantic_work_queue.py \
            --workers 25 --limit 250 \
            --output /tmp/fft-real-250/manifests | tee /tmp/fft-real-250/queue.log
          grep -qx 'TOTAL_TASKS=250' /tmp/fft-real-250/queue.log
          test "$(find /tmp/fft-real-250/manifests -name 'semantic-worker-*.json' | wc -l)" -eq 25
      - name: Run bounded static inspection against the real ELF
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_pilot.py \
            --workers 25 \
            --manifests /tmp/fft-real-250/manifests \
            --output /tmp/fft-real-250/pilot | tee /tmp/fft-real-250/pilot.log
          grep -qx 'PILOT_PARTIAL=250' /tmp/fft-real-250/pilot.log
          grep -qx 'PILOT_FAILED=0' /tmp/fft-real-250/pilot.log
          grep -qx 'PILOT_MANIFEST_SHARDS=25' /tmp/fft-real-250/pilot.log
          grep -qx 'PILOT_CONCURRENT_THREADS=16' /tmp/fft-real-250/pilot.log
      - name: Independently audit every output and repeat ELF inspection
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_manifest_audit.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --manifests /tmp/fft-real-250/manifests \
            --pilot /tmp/fft-real-250/pilot \
            --expected-workers 25 --expected-tasks 250 \
            --reinspect \
            --report /tmp/fft-real-250/REAL_ELF_250_AUDIT.md \
            | tee /tmp/fft-real-250/audit.log
          grep -qx 'REAL_ELF_AUDIT_STATIC_REPORTS=250' /tmp/fft-real-250/audit.log
          grep -qx 'REAL_ELF_AUDIT_REINSPECTED=1' /tmp/fft-real-250/audit.log
          grep -qx 'REAL_ELF_AUDIT_CERTIFICATES_CREATED=0' /tmp/fft-real-250/audit.log
      - name: Iterative ARM differential loop with immutable checkpoints
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_loop_250.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --manifests /tmp/fft-real-250/manifests \
            --pilot /tmp/fft-real-250/pilot \
            --max-candidates 24 --round-size 8 \
            --checkpoint /tmp/fft-real-250/semantic-loop-checkpoint.json \
            --report /tmp/fft-real-250/SEMANTIC_LOOP_250.md \
            | tee /tmp/fft-real-250/semantic-loop.log
          grep -qx 'LOOP_FAILED=0' /tmp/fft-real-250/semantic-loop.log
          grep -qx 'LOOP_NEW_CERTIFICATES=0' /tmp/fft-real-250/semantic-loop.log
          cp /tmp/fft-real-250/semantic-loop-checkpoint.json /tmp/fft-loop-before.json
          python3 FFT_Android_Mod/docs/re-tools/semantic_loop_250.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --manifests /tmp/fft-real-250/manifests \
            --pilot /tmp/fft-real-250/pilot \
            --max-candidates 24 --round-size 8 \
            --checkpoint /tmp/fft-real-250/semantic-loop-checkpoint.json \
            --report /tmp/fft-real-250/SEMANTIC_LOOP_250.md \
            | tee /tmp/fft-real-250/semantic-loop-resume.log
          cmp /tmp/fft-loop-before.json /tmp/fft-real-250/semantic-loop-checkpoint.json
          grep -qx 'LOOP_FAILED=0' /tmp/fft-real-250/semantic-loop-resume.log
          grep -qx 'LOOP_NEW_CERTIFICATES=0' /tmp/fft-real-250/semantic-loop-resume.log
      - name: Expand loop to all eligible A32 entries in the 250-task batch
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_loop_250.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --manifests /tmp/fft-real-250/manifests \
            --pilot /tmp/fft-real-250/pilot \
            --max-candidates 250 --round-size 16 \
            --checkpoint /tmp/fft-real-250/semantic-loop-full-checkpoint.json \
            --report /tmp/fft-real-250/SEMANTIC_LOOP_250_FULL.md \
            | tee /tmp/fft-real-250/semantic-loop-full.log
          grep -qx 'LOOP_FAILED=0' /tmp/fft-real-250/semantic-loop-full.log
          grep -qx 'LOOP_NEW_CERTIFICATES=0' /tmp/fft-real-250/semantic-loop-full.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path('/tmp/fft-real-250')
          snapshot = json.loads((folder / 'semantic-loop-full-checkpoint.json').read_text())
          selected = snapshot['selected']
          rounds = snapshot['rounds']
          actual = sum(record['samples'] for record in rounds)
          assert snapshot['eligible'] == len(selected), 'Some eligible A32 entries were omitted'
          assert 0 < len(selected) <= 250, 'Invalid selected count'
          assert actual == len(selected) * 32, 'Missing or duplicate sample'
          assert all(len(record['items']) <= 16 for record in rounds), 'Invalid iteration width'
          assert snapshot['new_certificates'] == 0
          print(f'LOOP_FULL_ENTRIES={len(selected)}')
          print(f'LOOP_FULL_DIFFERENTIAL_PASSED={actual}')
          PY
          cp /tmp/fft-real-250/semantic-loop-full-checkpoint.json /tmp/fft-loop-full-before.json
          python3 FFT_Android_Mod/docs/re-tools/semantic_loop_250.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --manifests /tmp/fft-real-250/manifests \
            --pilot /tmp/fft-real-250/pilot \
            --max-candidates 250 --round-size 16 \
            --checkpoint /tmp/fft-real-250/semantic-loop-full-checkpoint.json \
            --report /tmp/fft-real-250/SEMANTIC_LOOP_250_FULL.md \
            | tee /tmp/fft-real-250/semantic-loop-full-resume.log
          cmp /tmp/fft-loop-full-before.json /tmp/fft-real-250/semantic-loop-full-checkpoint.json
          grep -qx 'LOOP_FAILED=0' /tmp/fft-real-250/semantic-loop-full-resume.log
          grep -qx 'LOOP_NEW_CERTIFICATES=0' /tmp/fft-real-250/semantic-loop-full-resume.log
      - name: Catalog 34 remaining opcodes and run bounded STR microexecutions
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_remaining_34.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --manifests /tmp/fft-real-250/manifests \
            --pilot /tmp/fft-real-250/pilot \
            --prior-checkpoint /tmp/fft-real-250/semantic-loop-full-checkpoint.json \
            --checkpoint /tmp/fft-real-250/semantic-remaining-34-checkpoint.json \
            --report /tmp/fft-real-250/SEMANTIC_REMAINING_34.md \
            --expected-missing 34 --round-size 8 \
            | tee /tmp/fft-real-250/remaining-34.log
          grep -qx 'REMAINING_34_CATALOG=34' /tmp/fft-real-250/remaining-34.log
          grep -qx 'REMAINING_34_STORE_TESTED=13' /tmp/fft-real-250/remaining-34.log
          grep -qx 'REMAINING_34_DYNAMIC_CASES=416' /tmp/fft-real-250/remaining-34.log
          grep -qx 'REMAINING_34_UNMODELED=21' /tmp/fft-real-250/remaining-34.log
          grep -qx 'REMAINING_34_FAILED=0' /tmp/fft-real-250/remaining-34.log
          grep -qx 'REMAINING_34_NEW_CERTIFICATES=0' /tmp/fft-real-250/remaining-34.log
          cp /tmp/fft-real-250/semantic-remaining-34-checkpoint.json /tmp/remaining-34-before.json
          python3 FFT_Android_Mod/docs/re-tools/semantic_remaining_34.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --manifests /tmp/fft-real-250/manifests \
            --pilot /tmp/fft-real-250/pilot \
            --prior-checkpoint /tmp/fft-real-250/semantic-loop-full-checkpoint.json \
            --checkpoint /tmp/fft-real-250/semantic-remaining-34-checkpoint.json \
            --report /tmp/fft-real-250/SEMANTIC_REMAINING_34.md \
            --expected-missing 34 --round-size 8 \
            | tee /tmp/fft-real-250/remaining-34-resume.log
          cmp /tmp/remaining-34-before.json /tmp/fft-real-250/semantic-remaining-34-checkpoint.json
          grep -qx 'REMAINING_34_FAILED=0' /tmp/fft-real-250/remaining-34-resume.log
          grep -qx 'REMAINING_34_NEW_CERTIFICATES=0' /tmp/fft-real-250/remaining-34-resume.log
      - name: A01 original ELF byte and wide-load differential loop
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_a01_memory_21.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --manifests /tmp/fft-real-250/manifests \
            --pilot /tmp/fft-real-250/pilot \
            --full-checkpoint /tmp/fft-real-250/semantic-loop-full-checkpoint.json \
            --remaining-checkpoint /tmp/fft-real-250/semantic-remaining-34-checkpoint.json \
            --checkpoint /tmp/fft-real-250/semantic-a01-memory-checkpoint.json \
            --report /tmp/fft-real-250/SEMANTIC_A01_MEMORY.md \
            --expected-prior 21 --round-size 5 \
            | tee /tmp/fft-real-250/semantic-a01-memory.log
          grep -qx 'A01_INPUT_UNMODELED=21' /tmp/fft-real-250/semantic-a01-memory.log
          grep -qx 'A01_STRB_TESTED=2' /tmp/fft-real-250/semantic-a01-memory.log
          grep -qx 'A01_LDRB_TESTED=1' /tmp/fft-real-250/semantic-a01-memory.log
          grep -qx 'A01_LDR_LARGE_TESTED=7' /tmp/fft-real-250/semantic-a01-memory.log
          grep -qx 'A01_NEW_ENTRIES=10' /tmp/fft-real-250/semantic-a01-memory.log
          grep -qx 'A01_NEW_DYNAMIC_CASES=320' /tmp/fft-real-250/semantic-a01-memory.log
          grep -qx 'A01_STILL_UNMODELED=11' /tmp/fft-real-250/semantic-a01-memory.log
          grep -qx 'A01_FAILED=0' /tmp/fft-real-250/semantic-a01-memory.log
          grep -qx 'A01_NEW_CERTIFICATES=0' /tmp/fft-real-250/semantic-a01-memory.log
          cp /tmp/fft-real-250/semantic-a01-memory-checkpoint.json /tmp/semantic-a01-memory-before.json
          python3 FFT_Android_Mod/docs/re-tools/semantic_a01_memory_21.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --manifests /tmp/fft-real-250/manifests \
            --pilot /tmp/fft-real-250/pilot \
            --full-checkpoint /tmp/fft-real-250/semantic-loop-full-checkpoint.json \
            --remaining-checkpoint /tmp/fft-real-250/semantic-remaining-34-checkpoint.json \
            --checkpoint /tmp/fft-real-250/semantic-a01-memory-checkpoint.json \
            --report /tmp/fft-real-250/SEMANTIC_A01_MEMORY.md \
            --expected-prior 21 --round-size 5 \
            | tee /tmp/fft-real-250/semantic-a01-memory-resume.log
          cmp /tmp/semantic-a01-memory-before.json /tmp/fft-real-250/semantic-a01-memory-checkpoint.json
          grep -qx 'A01_NEW_DYNAMIC_CASES=320' /tmp/fft-real-250/semantic-a01-memory-resume.log
          grep -qx 'A01_FAILED=0' /tmp/fft-real-250/semantic-a01-memory-resume.log
          grep -qx 'A01_NEW_CERTIFICATES=0' /tmp/fft-real-250/semantic-a01-memory-resume.log
      - name: A02 original ELF bounded prefix and direct branch loop
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_a02_branch_11.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --manifests /tmp/fft-real-250/manifests \
            --pilot /tmp/fft-real-250/pilot \
            --full-checkpoint /tmp/fft-real-250/semantic-loop-full-checkpoint.json \
            --remaining-checkpoint /tmp/fft-real-250/semantic-remaining-34-checkpoint.json \
            --a01-checkpoint /tmp/fft-real-250/semantic-a01-memory-checkpoint.json \
            --checkpoint /tmp/fft-real-250/semantic-a02-branch-checkpoint.json \
            --report /tmp/fft-real-250/SEMANTIC_A02_BRANCHES.md \
            --round-size 4 | tee /tmp/fft-real-250/a02-branch.log
          grep -qx 'A02_ENTRIES=11' /tmp/fft-real-250/a02-branch.log
          grep -qx 'A02_PREFIX_BRANCHES=10' /tmp/fft-real-250/a02-branch.log
          grep -qx 'A02_SELF_LOOP_ONE_STEP=1' /tmp/fft-real-250/a02-branch.log
          grep -qx 'A02_DYNAMIC_CASES=352' /tmp/fft-real-250/a02-branch.log
          grep -qx 'A02_BRANCH_TARGETS_EXECUTED=0' /tmp/fft-real-250/a02-branch.log
          grep -qx 'A02_FAILED=0' /tmp/fft-real-250/a02-branch.log
          grep -qx 'A02_NEW_CERTIFICATES=0' /tmp/fft-real-250/a02-branch.log
          cp /tmp/fft-real-250/semantic-a02-branch-checkpoint.json /tmp/a02-branch-before.json
          python3 FFT_Android_Mod/docs/re-tools/semantic_a02_branch_11.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --manifests /tmp/fft-real-250/manifests \
            --pilot /tmp/fft-real-250/pilot \
            --full-checkpoint /tmp/fft-real-250/semantic-loop-full-checkpoint.json \
            --remaining-checkpoint /tmp/fft-real-250/semantic-remaining-34-checkpoint.json \
            --a01-checkpoint /tmp/fft-real-250/semantic-a01-memory-checkpoint.json \
            --checkpoint /tmp/fft-real-250/semantic-a02-branch-checkpoint.json \
            --report /tmp/fft-real-250/SEMANTIC_A02_BRANCHES.md \
            --round-size 4 | tee /tmp/fft-real-250/a02-branch-replay.log
          cmp /tmp/a02-branch-before.json /tmp/fft-real-250/semantic-a02-branch-checkpoint.json
          grep -qx 'A02_DYNAMIC_CASES=352' /tmp/fft-real-250/a02-branch-replay.log
          grep -qx 'A02_BRANCH_TARGETS_EXECUTED=0' /tmp/fft-real-250/a02-branch-replay.log
          grep -qx 'A02_FAILED=0' /tmp/fft-real-250/a02-branch-replay.log
          grep -qx 'A02_NEW_CERTIFICATES=0' /tmp/fft-real-250/a02-branch-replay.log
      - name: A04 inspect seven file-backed ELF branch destinations without execution
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_destinations.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --checkpoint /tmp/fft-real-250/semantic-a04-targets-checkpoint.json \
            --report /tmp/fft-real-250/SEMANTIC_A04_TARGETS.md \
            | tee /tmp/fft-real-250/a04-destinations.log
          grep -qx 'A04_ORIGINAL_ELF=1' /tmp/fft-real-250/a04-destinations.log
          grep -qx 'A04_DISTINCT_TARGETS=7' /tmp/fft-real-250/a04-destinations.log
          grep -qx 'A04_AUDITED_FILE_BYTES=672' /tmp/fft-real-250/a04-destinations.log
          grep -qx 'A04_TARGETS_EXECUTED=0' /tmp/fft-real-250/a04-destinations.log
          grep -qx 'A04_NEW_CERTIFICATES=0' /tmp/fft-real-250/a04-destinations.log
          cp /tmp/fft-real-250/semantic-a04-targets-checkpoint.json /tmp/a04-before.json
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_destinations.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --checkpoint /tmp/fft-real-250/semantic-a04-targets-checkpoint.json \
            --report /tmp/fft-real-250/SEMANTIC_A04_TARGETS.md \
            | tee /tmp/fft-real-250/a04-destinations-replay.log
          cmp /tmp/a04-before.json /tmp/fft-real-250/semantic-a04-targets-checkpoint.json
          grep -qx 'A04_AUDIT_REPLAY=PASS' /tmp/fft-real-250/a04-destinations-replay.log
      - name: A04 run four real callers through original dispatcher and one getter
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_dispatcher_exec.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --a04-static-checkpoint /tmp/fft-real-250/semantic-a04-targets-checkpoint.json \
            --checkpoint /tmp/fft-real-250/semantic-a04-dispatcher-checkpoint.json \
            --report /tmp/fft-real-250/SEMANTIC_A04_DISPATCHER.md \
            | tee /tmp/fft-real-250/a04-dispatcher.log
          grep -qx 'A04_DISPATCHER_CALLERS=4' /tmp/fft-real-250/a04-dispatcher.log
          grep -qx 'A04_DISPATCHER_CASES=512' /tmp/fft-real-250/a04-dispatcher.log
          grep -qx 'A04_GETTER_CASES=32' /tmp/fft-real-250/a04-dispatcher.log
          grep -qx 'A04_DYNAMIC_CASES=544' /tmp/fft-real-250/a04-dispatcher.log
          grep -qx 'A04_UNMODELED_TARGETS=5' /tmp/fft-real-250/a04-dispatcher.log
          grep -qx 'A04_FAILED=0' /tmp/fft-real-250/a04-dispatcher.log
          grep -qx 'A04_NEW_CERTIFICATES=0' /tmp/fft-real-250/a04-dispatcher.log
          cp /tmp/fft-real-250/semantic-a04-dispatcher-checkpoint.json /tmp/a04-dispatcher-before.json
          python3 FFT_Android_Mod/docs/re-tools/semantic_a04_dispatcher_exec.py \
            --binary FFT_Android_Mod/src/lib/armeabi/libgl2jni.so \
            --a04-static-checkpoint /tmp/fft-real-250/semantic-a04-targets-checkpoint.json \
            --checkpoint /tmp/fft-real-250/semantic-a04-dispatcher-checkpoint.json \
