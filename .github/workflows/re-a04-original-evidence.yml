name: A04 original runtime evidence host regression

on:
  pull_request:
    paths:
      - '.github/workflows/re-a04-original-evidence.yml'
      - 'FFT_Android_Mod/docs/re-tools/a04-original-runtime-evidence.py'
      - 'FFT_Android_Mod/docs/re-tools/a04-original-runtime-evidence.schema.json'
      - 'FFT_Android_Mod/docs/re-tools/test_a04_original_runtime_evidence.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  strict-host-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned JSON Schema validator (no Android emulator)
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - name: Compile validator and run fail-closed tests
        run: |
          set -euo pipefail
          python -m py_compile FFT_Android_Mod/docs/re-tools/a04-original-runtime-evidence.py
          python -m unittest discover -s FFT_Android_Mod/docs/re-tools -p test_a04_original_runtime_evidence.py -v
