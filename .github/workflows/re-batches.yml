name: Automated ARM reverse engineering batches

on:
  push:
    branches: [main]
    paths:
      - '.github/ci/requirements-arm-re.txt'
      - '.github/workflows/re-batches.yml'
      - 'FFT_Android_Mod/docs/re-tools/**'
      # Independent Android diagnostics use their own cheap PR gate; do not
      # launch costly structural ARM batches for changes only to that probe.
      - '!FFT_Android_Mod/docs/re-tools/android-path-probe/**'
      - 'FFT_Android_Mod/docs/RE_COMPLETION_PLAN.md'
      - 'FFT_Android_Mod/docs/re-results/RE_COMPLETION_TRACKER.json'
      - 'FFT_Android_Mod/docs/re-results/semantic-certificates.json'
      - 'FFT_Android_Mod/docs/RE_FUNCTION_INVENTORY.csv'
      - 'FFT_Android_Mod/src/lib/armeabi/libgl2jni.so'
  workflow_dispatch:
    inputs:
      limit:
        description: 'New functions (100 to 250)'
        required: false
        default: '100'
  # Six UTC triggers per day (00:17, 04:17, 08:17, 12:17, 16:17, 20:17 America/Fortaleza).
  # The existing workflow concurrency group serializes batches without cancelling a running job.
  # Preserve the original 03:17 UTC trigger; retain workflow_dispatch and automatic continuation.
  schedule:
    - cron: '17 3,7,11,15,19,23 * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: re-automated-batches
  cancel-in-progress: false

jobs:
  analyze-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/ci/requirements-arm-re.txt'
      - name: Compile all ARM tools and run full regression suite
        run: |
          python3 -m pip install -r .github/ci/requirements-arm-re.txt
          python3 -m compileall -q FFT_Android_Mod/docs/re-tools
          python3 -m unittest discover -s FFT_Android_Mod/docs/re-tools -p 'test_*.py' -v
      - name: Validate completion tracker before auto-generating dashboard
        run: |
          set -euo pipefail
          sha=$(sha256sum FFT_Android_Mod/src/lib/armeabi/libgl2jni.so | cut -d' ' -f1)
          python3 FFT_Android_Mod/docs/re-tools/re_completion_tracker.py \
            --tracker FFT_Android_Mod/docs/re-results/RE_COMPLETION_TRACKER.json \
            --expected-sha "$sha"
      - name: Restore initial batch checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p FFT_Android_Mod/docs/re-results
          if [ "$(python3 FFT_Android_Mod/docs/re-tools/checkpoint_files.py --count)" -eq 0 ]; then
            gh run download 40148837136 --repo "${GITHUB_REPOSITORY}" \
              --name reverse-engineering-report \
              --dir FFT_Android_Mod/docs/re-results
          fi
      - name: Validate initial real ELF baseline
        run: |
          python3 FFT_Android_Mod/docs/re-tools/check_smoke.py \
            FFT_Android_Mod/docs/re-results
      - name: Record starting checkpoint count
        id: starting
        run: |
          count=$(python3 FFT_Android_Mod/docs/re-tools/checkpoint_files.py --count)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Analyze next bounded batch
        env:
          REQUESTED_LIMIT: ${{ inputs.limit }}
        run: |
          LIMIT="${REQUESTED_LIMIT:-100}"
          case "$LIMIT" in
            ''|*[!0-9]*) echo 'Limit must be numeric'; exit 2;;
          esac
          if [ "$LIMIT" -lt 100 ] || [ "$LIMIT" -gt 250 ]; then
            echo 'Limit must be from 100 to 250'; exit 2
          fi
          python3 FFT_Android_Mod/docs/re-tools/parallel_loop.py \
            --workers 5 --limit "$LIMIT" --timeout 120
          python3 FFT_Android_Mod/docs/re-tools/check_smoke.py \
            FFT_Android_Mod/docs/re-results
      - name: Upgrade up to 100 stale review checkpoints with structural v3
        id: upgrade
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/parallel_loop.py \
            --review-only --retry-review --upgrade-v3 --workers 5 --limit 100 --timeout 120 | tee /tmp/re-v3-upgrade.log
          count=$(sed -n 's/^V3_UPGRADED=//p' /tmp/re-v3-upgrade.log | tail -1)
          if [[ ! "$count" =~ ^[0-9]+$ ]]; then
            echo "Missing structural v3 upgrade count"; exit 1
          fi
          if [ "$count" -gt 0 ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi
          python3 FFT_Android_Mod/docs/re-tools/check_smoke.py \
            FFT_Android_Mod/docs/re-results
      - name: Summarize accepted vs review
        run: python3 FFT_Android_Mod/docs/re-tools/checkpoint_files.py --verify
      - name: Generate progress and review queue
        run: |
          python3 FFT_Android_Mod/docs/re-tools/progress_report.py
      - name: Export prioritized manual review queue
        run: |
          python3 FFT_Android_Mod/docs/re-tools/export_review_queue.py
      - name: Collect next 8 pending ARM evidence reports
        id: evidence
        run: |
          set -euo pipefail
          python3 FFT_Android_Mod/docs/re-tools/semantic_evidence.py --limit 8 | tee /tmp/re-evidence.log
          generated=$(sed -n 's/^EVIDENCE_GENERATED=//p' /tmp/re-evidence.log | tail -1)
          if [[ ! "$generated" =~ ^[0-9]+$ ]]; then
            echo 'Missing evidence count'; exit 1
          fi
          if [ "$generated" -gt 0 ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate conservative ARM conditional-path contracts
        run: |
          python3 FFT_Android_Mod/docs/re-tools/semantic_path_report.py --limit 12
      - name: Verify real ELF bit-clearing by isolated ARM microexecution
        run: |
          python3 FFT_Android_Mod/docs/re-tools/semantic_microexec.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_branch_microexec.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_guarded_block.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_two_guards.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_entry_prefix.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_return_call.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_callee_v2icon.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_v2icon_execute.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_v2icon_call_flow.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_v2icon_destinations.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_three_callees_audit.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_three_callees_exec.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_sound_chain.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_sound_dispatch_audit.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_sound_icon_microexec.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_next_boundaries.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_next_pointer_microexec.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_getparam_getscale.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_getparam_getscale_exec.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_post_getter_paths.py
      - name: Audit unresolved houkoku ARM destinations
        run: python3 FFT_Android_Mod/docs/re-tools/semantic_houkoku_next_boundaries.py
      - name: Microexecute two original sound_request ARM branches
        run: python3 FFT_Android_Mod/docs/re-tools/semantic_sound_two_hop_exec.py
      - name: Audit next sound_request target and all 3 ARM incoming entries
        run: python3 FFT_Android_Mod/docs/re-tools/semantic_sound_destination_271314.py
      - name: Microexecute three ARM sound entry prefixes on original ELF
        run: python3 FFT_Android_Mod/docs/re-tools/semantic_sound_three_entry_exec.py
      - name: Audit original SysSE_PlayDef A32 destination bytes
        run: python3 FFT_Android_Mod/docs/re-tools/semantic_sound_playdef_entry.py
      - name: Reconstruct verified sound prefix and compare original ARM to C
        run: python3 FFT_Android_Mod/docs/re-tools/semantic_sound_functional_reconstruction.py
      - name: Audit and safely microexecute original sound common body
        run: python3 FFT_Android_Mod/docs/re-tools/semantic_sound_common_body.py
      - name: Reconstruct real sound common-body prologue and compare ARM to C
        run: python3 FFT_Android_Mod/docs/re-tools/semantic_sound_common_prologue.py
      - name: Audit ELF global sound slot and test bounded indirect A32 LDR
        run: python3 FFT_Android_Mod/docs/re-tools/semantic_sound_global_slot.py
      - name: Publish v3 coverage diagnostics and migration counts
        run: |
          python3 FFT_Android_Mod/docs/re-tools/structural_v3_report.py
      - name: Collect same-run semantic worker and Unicorn evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fft-semantic
          python3 FFT_Android_Mod/docs/re-tools/semantic_certificate_gate.py
          python3 FFT_Android_Mod/docs/re-tools/semantic_coverage.py \
            --output FFT_Android_Mod/docs/re-results/SEMANTIC_COVERAGE.md
          python3 FFT_Android_Mod/docs/re-tools/semantic_dynamic_evidence.py \
            --output /tmp/fft-semantic/dynamic-evidence
          python3 FFT_Android_Mod/docs/re-tools/semantic_leaf_bxlr.py \
            --output /tmp/fft-semantic/dynamic-evidence \
            --report FFT_Android_Mod/docs/re-results/SEMANTIC_LEAF_BXLR.md
          python3 FFT_Android_Mod/docs/re-tools/semantic_bxlr_contract_pilot.py \
            --limit 303 --output /tmp/fft-semantic/contract-pilot \
            --report FFT_Android_Mod/docs/re-results/SEMANTIC_BXLR_CONTRACT_PILOT.md
          python3 FFT_Android_Mod/docs/re-tools/semantic_bxlr_review_batch.py \
            --limit 100 --up-to --contracts-dir /tmp/fft-semantic/contract-pilot \
            --manifest FFT_Android_Mod/docs/re-results/SEMANTIC_BXLR_REVIEW_BATCH.json \
            --report FFT_Android_Mod/docs/re-results/SEMANTIC_BXLR_REVIEW_BATCH.md
          python3 FFT_Android_Mod/docs/re-tools/semantic_work_queue.py \
            --workers 5 --limit 5 \
            --candidate-evidence-dir /tmp/fft-semantic/dynamic-evidence \
            --output /tmp/fft-semantic/manifests
          python3 FFT_Android_Mod/docs/re-tools/semantic_pilot.py \
            --workers 5 --manifests /tmp/fft-semantic/manifests \
            --output /tmp/fft-semantic/pilot
          python3 FFT_Android_Mod/docs/re-tools/semantic_history.py \
            --output FFT_Android_Mod/docs/re-results/SEMANTIC_HISTORY_INDEX.md
          python3 FFT_Android_Mod/docs/re-tools/semantic_run_snapshot.py \
            --pilot-dir /tmp/fft-semantic/pilot \
            --dynamic-dir /tmp/fft-semantic/dynamic-evidence \
            --contracts-dir /tmp/fft-semantic/contract-pilot \
            --manifests-dir /tmp/fft-semantic/manifests \
            --output FFT_Android_Mod/docs/re-results/SEMANTIC_RUN_SNAPSHOT.json
      - name: Update central FFT Craft dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=30" > /tmp/recent-merged-prs.json; then
            python3 FFT_Android_Mod/docs/re-tools/status_geral.py \
              --pulls-json /tmp/recent-merged-prs.json \
              --pilot-dir /tmp/fft-semantic/pilot \
              --dynamic-dir /tmp/fft-semantic/dynamic-evidence \
              --manifests-dir /tmp/fft-semantic/manifests \
              --contracts-dir /tmp/fft-semantic/contract-pilot
          else
            echo "GitHub PR metadata unavailable; preserving the dashboard without recent PR metadata"
            python3 FFT_Android_Mod/docs/re-tools/status_geral.py \
              --pilot-dir /tmp/fft-semantic/pilot \
              --dynamic-dir /tmp/fft-semantic/dynamic-evidence \
              --manifests-dir /tmp/fft-semantic/manifests \
              --contracts-dir /tmp/fft-semantic/contract-pilot
          fi
          grep -q 'Aprovação estrutural entre checkpoints' \
            FFT_Android_Mod/docs/re-results/STATUS_GERAL.md
      - name: Count newly checkpointed functions
        id: progress
        env:
          BEFORE: ${{ steps.starting.outputs.count }}
        run: |
          after=$(python3 FFT_Android_Mod/docs/re-tools/checkpoint_files.py --count)
          if [ "$after" -gt "$BEFORE" ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Checkpoint count: $BEFORE -> $after"
      - name: Create checkpoint PR and merge automatically
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Results were generated against this exact checkout. Never merge
          # stale run-specific metadata over a newer main branch.
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$CURRENT_MAIN" != "$CHECKOUT_SHA" ]; then
            echo "::warning::main moved while this batch ran ($CHECKOUT_SHA -> $CURRENT_MAIN); skip publishing stale checkpoints. Raw evidence remains in the always-uploaded workflow artifact."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="automation/re-results-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git add FFT_Android_Mod/docs/re-results/
          if git diff --cached --quiet; then
            echo 'No checkpoint changes'
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'chore(re): persist ARM batch checkpoints [skip ci]'
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(re): automated structural batch ${GITHUB_RUN_ID}" \
            --body "Automated original-ELF structural checkpoints and evidence; semantic certificates are unchanged. If main changes before merging, this PR must not overwrite newer generated results.")
          echo "Checkpoint PR: $PR_URL"
          # Check main again before merge. Another writer could have
          # published between the first check and PR creation.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$CHECKOUT_SHA" ]; then
            echo "::error::main advanced before automated merge; leaving $PR_URL OPEN for safe reconciliation."
            exit 1
          fi
          if ! gh pr merge "$BRANCH" --squash --delete-branch; then
            echo "::error::Automated merge did not complete (possibly conflicting generated files). Leave $PR_URL open, preserve main and reconcile the PR; do NOT force-merge."
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automated-re-batch
          path: FFT_Android_Mod/docs/re-results/
          retention-days: 30

      - name: Start next batch after successful merge
        if: ${{ success() && steps.publish.outputs.published == 'true' && (steps.progress.outputs.has_new == 'true' || steps.evidence.outputs.has_new == 'true' || steps.upgrade.outputs.has_new == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run re-batches.yml --repo "$GITHUB_REPOSITORY" --ref main -f limit=100
          echo "Triggered next batch to continue checkpoints or semantic evidence"
